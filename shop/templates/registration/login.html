<!DOCTYPE html>
<html>
<head>
    <title>Login - Lyn's Mini Shop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f6fa;
        }

        .navbar {
            background-color: #212529;
        }

        .navbar-brand {
            color: white !important;
            font-weight: bold;
        }

        .login-card {
            max-width: 450px;
            margin: 70px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .login-title {
            font-weight: bold;
        }

        .form-control {
            border-radius: 8px;
        }

        .login-button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 17px;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="container">

            <a class="navbar-brand" href="{% url 'product_list' %}">
                🛒 Lyn's Mini Shop
            </a>

            <a href="{% url 'register' %}" class="btn btn-light">
                Register
            </a>

        </div>
    </nav>


    <div class="container">

        <div class="login-card">

            <div class="text-center mb-4">

                <h1 class="login-title">
                    Welcome Back 👋
                </h1>

                <p class="text-muted">
                    Login to continue shopping.
                </p>

            </div>


            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit"
                        class="btn btn-primary login-button">
                    Login
                </button>

            </form>


            <p class="text-center mt-4">

                Don't have an account?

                <a href="{% url 'register' %}">
                    Register here
                </a>

            </p>

        </div>

    </div>

</body>
</html>
