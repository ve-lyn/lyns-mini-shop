<!DOCTYPE html>
<html>
<head>
    <title>Register - Lyn's Mini Shop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f6fa;
        }

        .navbar {
            background-color: #212529;
        }

        .navbar-brand {
            color: white !important;
            font-weight: bold;
        }

        .register-card {
            max-width: 500px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .register-title {
            font-weight: bold;
        }

        .form-control {
            border-radius: 8px;
        }

        .register-button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 17px;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="container">

            <a class="navbar-brand" href="{% url 'product_list' %}">
                🛒 Lyn's Mini Shop
            </a>

            <a href="{% url 'login' %}" class="btn btn-light">
                Login
            </a>

        </div>
    </nav>


    <div class="container">

        <div class="register-card">

            <div class="text-center mb-4">

                <h1 class="register-title">
                    Create an Account
                </h1>

                <p class="text-muted">
                    Register to start shopping with us.
                </p>

            </div>


            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit"
                        class="btn btn-primary register-button">
                    Create Account
                </button>

            </form>


            <p class="text-center mt-4">

                Already have an account?

                <a href="{% url 'login' %}">
                    Login here
                </a>

            </p>

        </div>

    </div>

</body>
</html>
